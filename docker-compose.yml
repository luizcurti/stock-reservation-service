services:
  app:
    build:
      context: ./services/stock-service
      dockerfile: Dockerfile
    container_name: stock_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql_database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-stock}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RESERVATION_CLEANUP_INTERVAL_MS: ${RESERVATION_CLEANUP_INTERVAL_MS:-300000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-30}
    depends_on:
      mysql_database:
        condition: service_healthy
    networks:
      - stock_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment_service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      CHAOS_MODE: ${CHAOS_MODE:-off}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    networks:
      - stock_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order_service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      STOCK_SERVICE_URL: http://app:3000
      PAYMENT_SERVICE_URL: http://payment-service:3002
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    depends_on:
      app:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - stock_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mysql_database:
    container_name: stock_mysql
    image: mysql:8.4
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/stock-service/SQL/stock.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-stock}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      TZ: America/Sao_Paulo
    networks:
      - stock_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 60s

volumes:
  mysql_data:
    driver: local

networks:
  stock_network:
    driver: bridge
