name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" on main re-runs the pipeline and deploys, e.g. to recreate the stack after
  # the Destroy workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main mid-deploy (it could leave a Terraform state lock behind).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/stock-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: services/stock-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Typecheck
        # Runs after build: app.ts imports the TSOA-generated ./build/routes,
        # which only exists once `npm run build` has generated it.
        run: npm run typecheck

      - name: E2E tests (real MySQL via Docker Compose)
        # No .env file exists in CI (it's gitignored), so the app's DB pool
        # (src/config/database.ts) needs these explicitly — they must match
        # the docker-compose.yml fallback defaults (DB_USER/DB_PASSWORD).
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: app_user
          DB_PASSWORD: root
          DB_NAME: stock_test
        run: npm run test:e2e

      - name: Stop E2E database
        if: always()
        run: docker compose down -v
        working-directory: ${{ github.workspace }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: services/stock-service/coverage

  test-stubs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, payment-service]
      fail-fast: false
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    needs: [test, test-stubs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Builds and starts all three services + MySQL, waits for all of them
      # to report healthy, and exercises the full order -> stock -> payment
      # chain over real HTTP (happy path, payment-service failing or down
      # releasing the reservation, insufficient stock, concurrent orders
      # never overselling, metrics/rate limiting consistent across cluster
      # workers, and the API collection). Tears itself down (and dumps
      # container logs first on failure) regardless of outcome.
      - name: Whole-stack integration test (docker compose)
        run: scripts/integration-test.sh

  infra:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: infra/
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: bootstrap/
        working-directory: bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # Deploys to real AWS on every push to main (or a manual run on main), once the checks pass.
  # Auth is GitHub OIDC -> IAM role (bootstrap/), so no AWS keys are stored in GitHub.
  # Configuration lives in the `production` GitHub environment (docs/deployment.md); until
  # AWS_DEPLOY_ROLE_ARN is set there, the job skips the AWS steps and stays green.
  deploy:
    name: Deploy to AWS
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [test, test-stubs, docker, infra]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_app_image_tag: ${{ github.sha }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check deploy configuration
        id: config
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set in the production environment. Run scripts/bootstrap.sh (see docs/deployment.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$AWS_REGION" ] && missing="$missing AWS_REGION"
          [ -z "$STATE_BUCKET" ] && missing="$missing TF_STATE_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy misconfigured::Missing in the production environment:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          terraform_wrapper: false

      # The S3 backend is only added here, at deploy time, so local runs keep local state.
      - name: Terraform init (S3 remote state)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=stock-reservation-service/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # The ECS services need their images to exist, so the registries come first (a no-op
      # after the first deploy), then the images are pushed, then the rest of the stack is
      # applied.
      - name: Terraform apply (ECR repositories)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color -auto-approve -target=aws_ecr_repository.service 2>&1 | tee ecr.log

      - name: Build and push the images
        if: steps.config.outputs.enabled == 'true'
        run: |
          terraform -chdir=infra output -json ecr_repository_urls > repos.json
          REGISTRY=$(jq -r 'to_entries[0].value | split("/")[0]' repos.json)
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          for service in $(jq -r 'keys[]' repos.json); do
            REPO=$(jq -r --arg s "$service" '.[$s]' repos.json)
            docker build -t "$REPO:${{ github.sha }}" "services/$service"
            docker push "$REPO:${{ github.sha }}"
          done

      - name: Terraform plan
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.log

      - name: Terraform apply
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log

      # Surface each Terraform "Error:" block as a run annotation, so failures are readable
      # from the run summary without downloading the raw log.
      - name: Report Terraform errors
        if: failure() && steps.config.outputs.enabled == 'true'
        working-directory: infra
        run: |
          for f in ecr.log plan.log apply.log; do
            [ -f "$f" ] || continue
            awk '{ gsub(/%/, "%25") }
                 /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
                 buf && n < 15 { buf = buf "%0A" $0; n++ }
                 END { if (buf) print buf }' "$f" |
              while IFS= read -r block; do echo "::error title=Terraform ($f)::${block}"; done
          done

      # Loads services/stock-service/SQL/stock.sql into a fresh database (a no-op once the
      # schema exists, see the `schema` task in infra/app.tf).
      - name: Apply the database schema (one-off ECS task)
        if: steps.config.outputs.enabled == 'true'
        run: |
          CLUSTER=$(terraform -chdir=infra output -raw ecs_cluster)
          terraform -chdir=infra output -json schema_task > schema.json
          NETWORK=$(jq -c '{awsvpcConfiguration: {subnets: .subnets, securityGroups: [.security_group], assignPublicIp: "ENABLED"}}' schema.json)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE \
            --task-definition "$(jq -r .task_definition schema.json)" \
            --network-configuration "$NETWORK" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          aws logs filter-log-events --log-group-name "$(jq -r .log_group schema.json)" \
            --log-stream-name-prefix "schema/schema/${TASK##*/}" --query 'events[].message' --output text || true
          if [ "$EXIT" != "0" ]; then
            echo "::error title=Schema task failed::exit code $EXIT (see the schema log stream in $(jq -r .log_group schema.json))"
            exit 1
          fi

      - name: Wait for the ECS services
        if: steps.config.outputs.enabled == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=infra output -raw ecs_cluster)" \
            --services $(terraform -chdir=infra output -json ecs_services | jq -r '.[]')

      - name: Smoke tests (real AWS)
        if: steps.config.outputs.enabled == 'true'
        run: |
          API=$(terraform -chdir=infra output -raw api_url)
          API_URL="$API" scripts/smoke-test.sh
          {
            echo "### Deployed :rocket:"
            echo "stock-service: ${API}/product/1"
            echo
            echo "order-service: POST ${API}/orders"
          } >> "$GITHUB_STEP_SUMMARY"
